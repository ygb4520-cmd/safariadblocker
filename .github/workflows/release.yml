name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json; print(json.load(open('WindowsExtension/manifest.json'))['version'])")
          echo "tag=$TAG manifest=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $VER"
            exit 1
          fi

      - name: Build Windows extension zip
        run: |
          cd WindowsExtension
          zip -r ../AdTrackerBlocker-Windows.zip . -x '*.DS_Store'

      - name: Build Mac (Xcode project) source zip
        run: |
          zip -r AdTrackerBlocker-Mac-Source.zip "Ad Tracker Blocker" scripts README.md -x '*.DS_Store' '*/xcuserdata/*' '*.xcuserstate'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AdTrackerBlocker-Windows.zip
            AdTrackerBlocker-Mac-Source.zip
