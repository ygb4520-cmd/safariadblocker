name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch: {}   # started on a tag by auto-tag.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('WindowsExtension/manifest.json'))['version'])")
          NORMALIZED_TAG="${TAG//./}"
          NORMALIZED_MANIFEST="${MANIFEST_VERSION//./}"
          echo "tag=$TAG manifest=$MANIFEST_VERSION"
          if [[ "$NORMALIZED_TAG" != "$NORMALIZED_MANIFEST" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Build Windows extension zip
        run: |
          cd WindowsExtension
          zip -r ../AdTrackerBlocker-Windows.zip . -x '*.DS_Store'

      - name: Build Mac (Xcode project) source zip
        run: |
          zip -r AdTrackerBlocker-Mac-Source.zip "Ad Tracker Blocker" scripts README.md -x '*.DS_Store' '*/xcuserdata/*' '*.xcuserstate'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            AdTrackerBlocker-Windows.zip
            AdTrackerBlocker-Mac-Source.zip
